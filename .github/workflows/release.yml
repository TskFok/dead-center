name: 测试与发布

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 自动测试
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: 安装 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  build:
    name: 构建 ${{ matrix.name }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2025
            args: --bundles nsis
          - name: macOS Universal
            os: macos-15
            args: --target universal-apple-darwin --bundles dmg
          - name: Linux x64
            os: ubuntu-24.04
            args: --bundles appimage,deb
    runs-on: ${{ matrix.os }}
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macOS Universal' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: 安装 Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: 导入 Windows 代码签名证书
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String("${{ secrets.WINDOWS_CERTIFICATE }}")
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\dead-center.pfx", $bytes)
          Import-PfxCertificate -FilePath "$env:RUNNER_TEMP\dead-center.pfx" -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString -String "${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}" -AsPlainText -Force)
          "TAURI_CONFIG={\"bundle\":{\"windows\":{\"certificateThumbprint\":\"${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}\",\"digestAlgorithm\":\"sha256\",\"timestampUrl\":\"http://timestamp.digicert.com\"}}}" | Out-File -FilePath $env:GITHUB_ENV -Append
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: "-"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Dead Center ${{ github.ref_name }}
          releaseBody: |
            跨平台防晕 3D 屏幕准星。

            - Windows：NSIS 安装包
            - macOS：Intel / Apple Silicon 通用 DMG
            - Linux：AppImage 与 DEB
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
